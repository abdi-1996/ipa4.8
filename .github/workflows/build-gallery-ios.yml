name: Build Colorize Gallery iOS

on:
  push:
    branches: [colorize-finance-311-build]
    paths:
      - "GalleryControlIOS/**"
      - ".github/workflows/build-gallery-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: GalleryControlIOS
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: GalleryControlIOS
        run: |
          set -euo pipefail
          rm -rf build Payload
          xcodebuild             -project ColorizeGalleryControl.xcodeproj             -scheme ColorizeGalleryControl             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=''             CONFIGURATION_BUILD_DIR="$PWD/build"             clean build

      - name: Package IPA
        working-directory: GalleryControlIOS
        run: |
          set -euo pipefail
          APP="$(find build -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'kz.colorize.gallerycontrol'
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Colorize-Gallery-Control-1.0.0-unsigned.ipa Payload
          unzip -tq Colorize-Gallery-Control-1.0.0-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Colorize-Gallery-Control-iOS
          path: GalleryControlIOS/Colorize-Gallery-Control-1.0.0-unsigned.ipa
          if-no-files-found: error
