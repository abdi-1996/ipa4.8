name: Build Colorize Finance 3.2.0

on:
  push:
    branches: [colorize-finance-311-build]
    paths:
      - "ColorizeFinance320/**"
      - ".github/workflows/colorize-finance-320.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ColorizeFinance320
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: ColorizeFinance320
        run: |
          set -euo pipefail
          rm -rf build Payload
          xcodebuild             -project ColorizeFinance.xcodeproj             -scheme ColorizeFinance             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=''             CONFIGURATION_BUILD_DIR="$PWD/build"             clean build

      - name: Verify and package
        working-directory: ColorizeFinance320
        run: |
          set -euo pipefail
          APP="$(find build -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -Fx 'kz.colorize.adcost'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" | grep -Fx '3.2.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" | grep -Fx '9'
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry Colorize-Finance-3.2.0-unsigned.ipa Payload
          unzip -tq Colorize-Finance-3.2.0-unsigned.ipa
          shasum -a 256 Colorize-Finance-3.2.0-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Colorize-Finance-3.2.0-IPA
          path: ColorizeFinance320/Colorize-Finance-3.2.0-unsigned.ipa
          if-no-files-found: error
