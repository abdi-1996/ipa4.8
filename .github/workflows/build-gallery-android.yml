name: Build Colorize Gallery Android

on:
  push:
    branches: [colorize-finance-311-build]
    paths:
      - "GalleryBridgeAndroid/**"
      - ".github/workflows/build-gallery-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: GalleryBridgeAndroid
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="GalleryBridgeAndroid/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          ls -lh "$APK"
          shasum -a 256 "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: Colorize-Gallery-Bridge-Android
          path: GalleryBridgeAndroid/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
