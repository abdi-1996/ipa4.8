plugins { id 'com.android.application' }

android {
    namespace 'kz.colorize.gallerybridge'
    compileSdk 35
    defaultConfig {
        applicationId "kz.colorize.gallerybridge"
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName "1.1.1"
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
